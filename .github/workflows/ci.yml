name: Main CI Orchestrator (Disabled)

# Disabled automatic triggers to stop GitHub email notifications.
# To trigger manually, go to GitHub Actions tab -> Run workflow.
on:
  workflow_dispatch:

jobs:
  summary-check:
    name: Repository Verification & Quality Gate Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Project Structure
        run: |
          echo "Starting DocMind Full Repository Quality Verification..."
          test -f README.md || exit 1
          test -f docker-compose.yml || exit 1
          test -d backend || exit 1
          test -d frontend || exit 1
          echo "Repository layout verified successfully!"

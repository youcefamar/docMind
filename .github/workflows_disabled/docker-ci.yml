name: Docker Container CI (Disabled)

# Disabled automatic triggers to stop GitHub email notifications.
on:
  workflow_dispatch:

jobs:
  docker-quality-gate:
    name: Validate Docker Compose & Image Builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml Syntax
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t docmind-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t docmind-frontend:ci ./frontend

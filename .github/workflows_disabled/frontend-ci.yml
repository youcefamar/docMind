name: Frontend CI (Disabled)

# Disabled automatic triggers to stop GitHub email notifications.
on:
  workflow_dispatch:

jobs:
  frontend-quality-gate:
    name: Frontend Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Production Build Validation
        run: |
          cd frontend
          npm run build

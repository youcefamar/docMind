[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-backend"
version = "1.0.0"
description = "Offline Internal Knowledge Assistant API with local hybrid RAG retrieval"
readme = "README.md"
authors = [
    { name = "DocMind Engineering Team", email = "engineering@docmind.internal" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=2.3.1",
    "faiss-cpu>=1.8.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "llama-cpp-python>=0.2.50",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.23.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=. --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["routes", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
